# auth.claim_types maps configured/JWT strings to UUID values at admission.
# Policies and fact-query bindings use those typed values without runtime casts.
relations:
  - schema: tenant_001
    table: projects
    computed:
      _role:
        type: integer
        expression: >-
          (claims.user_id != null && facts["user-grants"].exists(g, true)) ||
          (claims.team_ids != null && facts["team-grants"].exists(g, g.item.team_id in claims.team_ids)) ? 2 : 0
        propagate:
          - to: {schema: tenant_001, table: project_tasks}
            when: parent.id == item.project_id && parent.organization_id == item.organization_id
      role:
        type: integer
        expression: computed._role
      canEdit:
        type: bool
        expression: computed._role >= 2
    facts:
      - id: user-grants
        projection:
          name: user-grants
          kind: list
          relation: {schema: tenant_001, table: project_user_grants}
          filter: {field: [deleted_at], operator: is_null}
          bindings:
            - {field: [organization_id], operator: eq, parameter: [item, organization_id]}
            - {field: [project_id], operator: eq, parameter: [item, id]}
            - {field: [user_id], operator: eq, parameter: [claims, user_id]}
      - id: team-grants
        projection:
          name: team-grants
          kind: list
          relation: {schema: tenant_001, table: project_team_grants}
          filter: {field: [deleted_at], operator: is_null}
          bindings:
            - {field: [organization_id], operator: eq, parameter: [item, organization_id]}
            - {field: [project_id], operator: eq, parameter: [item, id]}
    visibility: >-
      item.deleted_at == null && claims.organization_id != null &&
      item.organization_id == claims.organization_id && computed._role >= 1
  - schema: tenant_001
    table: project_tasks
    receive:
      - {from: {schema: tenant_001, table: projects}, field: _role}
    computed:
      _role:
        type: integer
        expression: 'has(inherited._role) ? inherited._role : 0'
        propagate:
          - to: {schema: tenant_001, table: tasks}
            when: parent.task_id == item.id && parent.organization_id == item.organization_id
    visibility: >-
      item.deleted_at == null && claims.organization_id != null &&
      item.organization_id == claims.organization_id && computed._role >= 1
  - schema: tenant_001
    table: tasks
    receive:
      - {from: {schema: tenant_001, table: project_tasks}, field: _role}
    computed:
      _role:
        type: integer
        expression: 'has(inherited._role) ? inherited._role : 0'
      role:
        type: integer
        expression: computed._role
      canEdit:
        type: bool
        expression: computed._role >= 2
    visibility: >-
      item.deleted_at == null && claims.organization_id != null &&
      item.organization_id == claims.organization_id && computed._role >= 1

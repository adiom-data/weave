# Example for an application with projects -> project_tasks -> tasks.
# These definitions do not create or assume these tables in the generic server.
# Claims use text IDs here; use uuid(claims.organization_id) in CEL if the
# underlying column is a UUID. Missing relation policies deny visibility.
relations:
  - schema: app
    table: projects
    receive: []
    allow:
      - id: same-organization
        when: item.organization_id == claims.organization_id
    propagate:
      - id: project-to-membership
        to: {schema: app, table: project_tasks}
        when: parent.id == item.project_id

  - schema: app
    table: project_tasks
    receive:
      - from: {schema: app, table: projects}
        id: project-to-membership
    propagate:
      - id: membership-to-task
        to: {schema: app, table: tasks}
        when: parent.task_id == item.id

  - schema: app
    table: tasks
    receive:
      - from: {schema: app, table: project_tasks}
        id: membership-to-task
    deny:
      - id: explicitly-hidden
        when: item.hidden == true
    # Independent access (when propagation did not grant it) can lazily load
    # private facts. These are ordinary reactive projection dependencies.
    facts:
      - id: direct_grants
        projection:
          name: direct_grants
          kind: list
          relation: {schema: app, table: task_user_grants}
          filter: {field: [deleted_at], operator: is_null}
          bindings:
            - field: [task_id]
              operator: eq
              parameter: [item, id]
            - field: [user_id]
              operator: eq
              parameter: [claims, user_id]
    allow:
      - id: direct-user-grant
        when: facts.direct_grants.exists(grant, true)
